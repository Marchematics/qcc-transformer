[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcc-transformer"
version = "0.1.0"
description = "Query-Compiled Cache Transformer: a research prototype for constant-size long-context memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]
authors = [{name = "Marchematics"}]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=7.4"]
hf = ["transformers>=4.45"]
hf-quant = ["transformers>=4.45", "bitsandbytes>=0.43"]
vllm = ["vllm>=0.11"]

[project.entry-points."vllm.general_plugins"]
qcc_stock_backend = "qcc_transformer.vllm_stock:register_stock_vllm_backend"

[tool.setuptools.packages.find]
include = ["qcc_transformer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
