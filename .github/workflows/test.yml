name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,hf]'
      - name: Test
        run: pytest -q

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,hf]'
      - name: Run the CPU quickstart
        run: python examples/retention_quickstart.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every documented artifact exists
        run: |
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("docs/CLAIMS.md").read_text() + pathlib.Path("docs/REPRODUCING.md").read_text()
          missing = sorted({m for m in re.findall(r"artifacts/[A-Za-z0-9._-]+\.json", text)
                            if not pathlib.Path(m).exists()})
          print("checked", len(set(re.findall(r"artifacts/[A-Za-z0-9._-]+\.json", text))), "artifact paths")
          if missing:
              print("missing:", *missing, sep="\n  "); sys.exit(1)
          PY
