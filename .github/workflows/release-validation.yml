name: release validation

on:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,hf]'
      - run: pytest -q

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,hf]'
      - run: python examples/retention_quickstart.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("docs/EVIDENCE.md").read_text() + pathlib.Path("docs/REPRODUCING.md").read_text()
          missing = sorted({
              m for m in re.findall(r"artifacts/[A-Za-z0-9._-]+\.json", text)
              if not pathlib.Path(m).exists()
          })
          if missing:
              print("missing:", *missing, sep="\n  ")
              sys.exit(1)
          PY
